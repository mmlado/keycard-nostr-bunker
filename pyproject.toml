[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keycard-nostr-bunker"
dynamic = ["version"]
description = "NIP-46 Nostr remote signer (bunker) backed by a Keycard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Mladen Milankovic"}]
keywords = ["nostr", "nip46", "nip-46", "bunker", "remote-signer", "nostr-connect", "keycard",
            "smartcard", "hardware-wallet", "schnorr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42",
    "ecdsa>=0.18",
    "keycard>=0.4.0",
    "pyscard>=2.0",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "flake8", "mypy"]

[project.urls]
Homepage = "https://github.com/mmlado/keycard-nostr-bunker"

[project.scripts]
keycard-nostr-bunker = "keycard_nostr_bunker.cli:main"

[tool.setuptools.packages.find]
include = ["keycard_nostr_bunker*"]

[tool.setuptools.package-data]
keycard_nostr_bunker = ["config.example.toml"]

[tool.setuptools.dynamic]
version = {attr = "keycard_nostr_bunker.__version__"}

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["ecdsa.*", "smartcard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["keycard_nostr_bunker"]
branch = true
