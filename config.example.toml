[relay]
urls = ["wss://relay.damus.io", "wss://nos.lol"]

[keycard]
# Leave empty to take it from KEYCARD_NOSTR_BUNKER_PIN, a systemd credential named
# "pin", or a prompt when running in a terminal. If you put it here, this file
# must be readable by you alone: chmod 600 config.toml
pin = ""
# Part of the PC/SC reader name to use; empty means any reader.
# `keycard-nostr-bunker readers` lists them.
reader = ""
# Derivation path of the Nostr key. Changing it changes the public key.
# Must be under m/44'/1237' (NIP-06) or m/43'/60'/1581' (EIP-1581), 5 levels.
key_path = "m/43'/60'/1581'/0'/0"
# Applet 4.x cards must carry an Identity Certificate from a trusted Keycard CA.
# The official CA is always trusted. Development cards use the Test CA or a
# CA of your own; trust those only on development machines.
trust_test_ca = false
ca_public_keys = []

[signer]
# Bunker keypair for the NIP-46 transport; generated on first run if absent.
# The other state files (secret, clients, pending, seen, user.pubkey) live
# next to it.
key_file = "~/.config/keycard-nostr-bunker/signer.key"

[signing]
# "allowed_kinds" signs only the event kinds listed below; "all" signs every
# kind an admitted client asks for.
policy = "allowed_kinds"
# 0 profile, 1 note, 3 contacts, 5 deletion, 6 repost, 7 reaction,
# 10002 relay list. Reading encrypted DMs needs no kind here, only decryption.
# Sending one needs 4 (NIP-04) or 13 (the NIP-17 seal; the kind 14 message inside
# it is never signed); 10050 is the NIP-17 DM relay list.
allowed_kinds = [0, 1, 3, 5, 6, 7, 10002]

[connection]
# Secret in the bunker:// URL. A client is admitted once it connects with it.
# Empty: generated on first run and stored next to the signer key.
secret = ""
# Replace the secret as soon as a client has used it, so a bunker URL serves
# one client and is then useless to whoever finds it. Needs an empty secret above.
rotate_secret = false
# Ask before admitting a client: a prompt when running in a terminal,
# otherwise `keycard-nostr-bunker clients approve <pubkey>` while the client waits.
approve_clients = false
# Client pubkeys, 64 hex characters, admitted without the secret: for example
# an app whose key you already know. Read at start; to revoke one, run
# `keycard-nostr-bunker clients revoke <pubkey>`, remove it here and restart.
authorized_clients = []
